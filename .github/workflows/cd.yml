name: CD-Pitstop

on: 
  push:
    branches: [main]
    tags: 
      - 1.0.8

jobs:
  
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
    - name: Récupérer le code
      uses: actions/checkout@v6

    - name: Installer Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '24'

    # - name:  Installer les dépendances
    #   run: npm ci

    - name: Lancer le build
      run: npm run build

    - name: Archive production artifacts
      uses: actions/upload-artifact@v7
      with:
        name: build
        path: |
          dist

  deploy:
    needs: [Build]
    name: deploy
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer l'artéfact
        uses: actions/download-artifact@v8
        with: 
          name: build
          path: dist/
          retention-days: 1

      - name: Déploiement sur le serveur
        run: |
          ssh ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_HOST }}
          rsync -av dist/ ${{secrets.VPS_USERNAME}}@${{secrets.VPS_HOST}}:/var/www/html

      # - name: Déployer sur le VPS via SSH
      #   uses: appleboy/scp-action@master
      #   with:
      #     host: ${{ secrets.VPS_HOST }}
      #     username: ${{ secrets.VPS_USERNAME }}
      #     key: ${{ secrets.SSH_PRIVATE_KEY }}
      #     port: ${{ secrets.VPS_PORT }}
      #     source: ".,!node_modules"
      #     target: "../../var/wwww/html"
